register_duplicate_known_bug:
  - title: 注册账号重复应返回业务参数错误
    role: anonymous
    payload:
      username: ${existing_user.username}
      password: ${existing_user.password}
    expect:
      http_status: 200
      code: 400
      message: 账号已存在
      data: null
    db_verify:
      exists: true
      fields:
        username: ${existing_user.username}
        name: 已存在用户
        role: student
        status: 1
      password_plaintext: ${existing_user.password}

