login_success:
  - title: 普通用户登录成功
    role: anonymous
    payload:
      username: test_user
      password: "123"
    expect:
      http_status: 200
      code: 200
      message: 登录成功
      data_keys:
        - token
        - user
      data_types:
        token: str
        user: dict
      nested_data_keys:
        user:
          - id
          - username
          - name
          - role
          - email
          - phone
          - avatar
          - status

  - title: 管理员登录成功
    role: anonymous
    payload:
      username: test_admin
      password: "123"
    expect:
      http_status: 200
      code: 200
      message: 登录成功
      data_keys:
        - token
        - user
      data_types:
        token: str
        user: dict
      nested_data_keys:
        user:
          - id
          - username
          - name
          - role
          - email
          - phone
          - avatar
          - status

login_fail:
  - title: 用户名不存在
    role: anonymous
    payload:
      username: not_exists_user
      password: "123"
    expect:
      http_status: 200
      code: 400
      message: 账号或密码错误

  - title: 密码错误
    role: anonymous
    payload:
      username: test
      password: wrong_password
    expect:
      http_status: 200
      code: 400
      message: 账号或密码错误

  - title: 用户名为空
    role: anonymous
    payload:
      username: ""
      password: "123"
    expect:
      http_status: 200
      code: 400
      message: 账号或密码错误

  - title: 密码为空
    role: anonymous
    payload:
      username: test
      password: ""
    expect:
      http_status: 200
      code: 400
      message: 账号或密码错误

  - title: 登录缺少用户名字段
    role: anonymous
    payload:
      password: "123"
    expect:
      http_status: 422
      code: 422
      message: 请求参数校验错误

  - title: 登录缺少密码字段
    role: anonymous
    payload:
      username: test
    expect:
      http_status: 422
      code: 422
      message: 请求参数校验错误

register_success:
  - title: 注册成功
    role: anonymous
    payload:
      username: auto_user_001
      password: "123456"
      name: 自动化用户
    expect:
      http_status: 200
      code: 200
      message: 注册成功

register_fail:
  - title: 注册用户名为空
    role: anonymous
    payload:
      username: ""
      password: "123456"
      name: 自动化用户
    expect:
      http_status: 422
      code: 422
      message: 请求参数校验错误

  - title: 注册密码为空
    role: anonymous
    payload:
      username: auto_empty_pwd
      password: ""
      name: 自动化用户
    expect:
      http_status: 422
      code: 422
      message: 请求参数校验错误

  - title: 注册缺少账号字段
    role: anonymous
    payload:
      password: "123"
    expect:
      http_status: 422
      code: 422
      message: 请求参数校验错误

  - title: 注册缺少密码字段
    role: anonymous
    payload:
      username: lost_password
    expect:
      http_status: 422
      code: 422
      message: 请求参数校验错误
