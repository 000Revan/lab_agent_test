login_success:
  - title: 普通用户登录成功
    role: anonymous
    payload:
      username: ${prepared_accounts.user.username}
      password: ${prepared_accounts.user.password}
    expect:
      http_status: 200
      code: 999
      message: 登录成功
      data_keys:
        - token
        - user
      data_types:
        token: str
        user: dict
      nested_data_keys:
        user:
          - id
          - username
          - name
          - role
          - email
          - phone
          - avatar
          - status

  - title: 管理员登录成功
    role: anonymous
    payload:
      username: ${prepared_accounts.admin.username}
      password: ${prepared_accounts.admin.password}
    expect:
      http_status: 200
      code: 200
      message: 登录成功
      data_keys:
        - token
        - user
      data_types:
        token: str
        user: dict
      nested_data_keys:
        user:
          - id
          - username
          - name
          - role
          - email
          - phone
          - avatar
          - status

login_fail:
  - title: 用户名不存在
    role: anonymous
    payload:
      username: ${register_candidate.username}
      password: ${register_candidate.password}
    expect:
      http_status: 200
      code: 400
      message: 账号或密码错误
      data: null

  - title: 已存在用户密码错误
    role: anonymous
    payload:
      username: ${prepared_accounts.user.username}
      password: wrong_password
    expect:
      http_status: 200
      code: 400
      message: 账号或密码错误
      data: null

  - title: 用户名为空
    role: anonymous
    payload:
      username: ""
      password: "123"
    expect:
      http_status: 200
      code: 400
      message: 账号或密码错误
      data: null

  - title: 已存在用户密码为空
    role: anonymous
    payload:
      username: ${prepared_accounts.user.username}
      password: ""
    expect:
      http_status: 200
      code: 400
      message: 账号或密码错误
      data: null

  - title: 登录缺少用户名字段
    role: anonymous
    payload:
      password: "123"
    expect:
      http_status: 422
      code: 422
      message: 请求参数校验错误
      data: null

  - title: 登录缺少密码字段
    role: anonymous
    payload:
      username: ${prepared_accounts.user.username}
    expect:
      http_status: 422
      code: 422
      message: 请求参数校验错误
      data: null

  - title: 用户名仅包含空格
    role: anonymous
    payload:
      username: "   "
      password: "123"
    expect:
      http_status: 200
      code: 400
      message: 账号或密码错误
      data: null

  - title: 已存在用户密码仅包含空格
    role: anonymous
    payload:
      username: ${prepared_accounts.user.username}
      password: "   "
    expect:
      http_status: 200
      code: 400
      message: 账号或密码错误
      data: null

  - title: 登录用户名为null
    role: anonymous
    payload:
      username: null
      password: "123"
    expect:
      http_status: 422
      code: 422
      message: 请求参数校验错误
      data: null

  - title: 登录密码为null
    role: anonymous
    payload:
      username: ${prepared_accounts.user.username}
      password: null
    expect:
      http_status: 422
      code: 422
      message: 请求参数校验错误
      data: null

  - title: 禁用用户登录失败
    role: anonymous
    payload:
      username: ${disabled_user.username}
      password: ${disabled_user.password}
    expect:
      http_status: 200
      code: 403
      message: 账号已被禁用
      data: null

login_known_bug:
  - title: 已存在用户使用超长密码登录应参数校验失败
    role: anonymous
    payload:
      username: ${prepared_accounts.user.username}
      password: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    expect:
      http_status: 422
      code: 422
      message: 请求参数校验错误
      data: null

register_success:
  - title: 注册成功
    role: anonymous
    payload:
      username: ${register_candidate.username}
      password: ${register_candidate.password}
      name: ${register_candidate.name}
    expect:
      http_status: 200
      code: 200
      message: 注册成功
      data: null
    db_verify:
      exists: true
      fields:
        username: ${register_candidate.username}
        name: ${register_candidate.name}
        role: student
        status: 1
      password_plaintext: ${register_candidate.password}

  - title: 注册成功-不传名称时默认使用用户名
    role: anonymous
    payload:
      username: ${register_candidate.username}
      password: ${register_candidate.password}
    expect:
      http_status: 200
      code: 200
      message: 注册成功
      data: null
    db_verify:
      exists: true
      fields:
        username: ${register_candidate.username}
        name: ${register_candidate.username}
        role: student
        status: 1
      password_plaintext: ${register_candidate.password}

  - title: 注册成功-忽略客户端提交的管理员角色和禁用状态
    role: anonymous
    payload:
      username: ${register_candidate.username}
      password: ${register_candidate.password}
      name: ${register_candidate.name}
      role: admin
      status: 0
    expect:
      http_status: 200
      code: 200
      message: 注册成功
      data: null
    db_verify:
      exists: true
      fields:
        username: ${register_candidate.username}
        name: ${register_candidate.name}
        role: student
        status: 1
      password_plaintext: ${register_candidate.password}

