[pytest]
# pytest 配置
; addopts=-vs --alluredir=./reports/temps --clean-alluredir

addopts =
    -v
    -ra
    --capture=tee-sys
    --junitxml=reports/junit.xml
    --alluredir=reports/temps
    --clean-alluredir

    
testpaths=testcases
python_files=test_*.py
python_classes=Test*
python_functions=test_*